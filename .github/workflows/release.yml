name: release
on:
  push:
    tags: ['v*']
# Least privilege: the build job only reads; only the publish job, which
# runs no project code, may write (create the release).
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "refusing to release from tag '$TAG' (want v followed by [0-9A-Za-z.+-])" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go vet ./... && go test -count=1 ./... && make check-pii
      - name: cross-build (CGO off) and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: make cross VERSION="$VERSION"
      - name: verify
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for f in dist/mail-export-viewer-linux-*; do file "$f"; file "$f" | grep -q 'statically linked' || exit 1; done
          ./dist/mail-export-viewer-linux-amd64 --version | grep -F -- "$VERSION"
          cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/mail-export-viewer-*
            dist/SHA256SUMS
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then echo "bad tag '$TAG'" >&2; exit 1; fi
          gh release create "$TAG" dist/mail-export-viewer-* dist/SHA256SUMS \
            --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
